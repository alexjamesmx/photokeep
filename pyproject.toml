[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photokeep"
dynamic = ["version"]
description = "Local-first photo archive with equal copies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
media = ["pillow>=10", "numpy>=2"]

[project.scripts]
photokeep = "photokeep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "numpy>=2",
    "mypy>=2.4.1",
]

[tool.hatch.version]
path = "photokeep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["photokeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The version lives in photokeep/__init__.py, so a change there must rebuild the installed metadata too.
cache-keys = [{ file = "pyproject.toml" }, { file = "photokeep/__init__.py" }]
