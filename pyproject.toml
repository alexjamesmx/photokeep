[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photokeep"
version = "0.1.0"
description = "Local-first photo archive with equal copies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
media = ["pillow>=10", "numpy>=2"]

[project.scripts]
photokeep = "photokeep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "numpy>=2",
    "mypy>=2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["photokeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
